<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S. — Biogreen Cortex</title>
<style>
  :root {
    --bg: #01040c;
    --cyan: #00dcff;
    --amber: #f5b84b;
    --magenta: #e44fd0;
    --green: #4ade80;
    --violet: #8b7cf6;
    --text: #c9d8ee;
    --dim: #5f7394;
    --faint: #2a3852;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: var(--mono); color: var(--text);
    -webkit-user-select: none; user-select: none; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse 130% 100% at 50% 42%, #061024 0%, #01040c 62%); }

  .grid { position: fixed; inset: 0; pointer-events: none; opacity: 0.5;
    background-image:
      linear-gradient(rgba(30,80,140,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,80,140,0.07) 1px, transparent 1px);
    background-size: 48px 48px; }
  .scanlines { position: fixed; inset: 0; pointer-events: none; opacity: 0.35;
    background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,10,25,0.35) 2px 4px); }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 95% 85% at 50% 45%, transparent 52%, rgba(0,2,8,0.85) 100%); }

  /* ------- HUD chrome ------- */
  .hud { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

  .wordmark { font-size: 17px; font-weight: 700; letter-spacing: 0.5em; color: #ecf7ff;
    text-shadow: 0 0 22px rgba(0,220,255,0.6); position: relative; }
  .wordmark b { color: var(--cyan); }
  .sub { font-size: 8.5px; letter-spacing: 0.34em; color: var(--dim); margin-top: 5px; }

  .statuschip { text-align: right; font-size: 9px; letter-spacing: 0.26em; }
  .statuschip .state { color: var(--dim); transition: color 0.3s; }
  .statuschip .state.live { color: var(--green); text-shadow: 0 0 12px rgba(74,222,128,0.5); }
  .statuschip .state.listen { color: var(--cyan); text-shadow: 0 0 12px rgba(0,220,255,0.6); }
  .statuschip .state.speak { color: var(--amber); text-shadow: 0 0 12px rgba(245,184,75,0.6); }
  .statuschip .timer { color: var(--faint); margin-top: 5px; font-variant-numeric: tabular-nums; }

  .bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .caption-user { font-size: 11px; color: #7ea3cc; max-width: 700px; text-align: center; min-height: 14px; }
  .caption-user::before { content: "▸ "; color: var(--faint); }
  .caption-user:empty { visibility: hidden; }
  .caption-ai { font-size: clamp(14px, 2.4vw, 19px); line-height: 1.5; color: #f0f8ff; max-width: 760px;
    text-align: center; text-shadow: 0 0 24px rgba(0,140,255,0.45); text-wrap: balance; min-height: 22px; }
  .caption-ai:empty { visibility: hidden; }

  .controls { display: flex; gap: 10px; align-items: center; pointer-events: auto; }
  .ctl { background: rgba(3,10,24,0.8); border: 1px solid rgba(0,220,255,0.35); color: var(--cyan);
    font: inherit; font-size: 9px; letter-spacing: 0.28em; padding: 8px 16px; border-radius: 3px;
    cursor: pointer; }
  .ctl:hover { background: rgba(0,220,255,0.12); }
  .ctl:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
  .ctl.danger { border-color: rgba(244,100,95,0.45); color: #f4938f; }
  .hint { font-size: 8.5px; letter-spacing: 0.3em; color: var(--faint); }

  /* ------- boot overlay ------- */
  .boot { position: fixed; inset: 0; z-index: 10; background: #010409;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
    transition: opacity 0.9s; }
  .boot.gone { opacity: 0; pointer-events: none; }
  .boot-title { font-size: clamp(26px, 7vw, 52px); font-weight: 700; letter-spacing: 0.42em;
    color: #ecf7ff; text-shadow: 0 0 34px rgba(0,220,255,0.65); animation: flicker 4s infinite; }
  .boot-title b { color: var(--cyan); }
  @keyframes flicker { 0%,93%,97%,100% { opacity: 1; } 94% { opacity: 0.55; } 96% { opacity: 0.8; } }
  .bootlog { font-size: 10.5px; line-height: 1.9; letter-spacing: 0.08em; color: var(--dim);
    min-height: 132px; width: min(480px, 84vw); }
  .bootlog .ok { color: var(--green); }
  .initbtn { pointer-events: auto; background: none; border: 1px solid var(--cyan); color: var(--cyan);
    font: inherit; font-size: 12px; letter-spacing: 0.42em; padding: 16px 38px 16px 44px; cursor: pointer;
    border-radius: 3px; box-shadow: 0 0 30px rgba(0,220,255,0.25), 0 0 60px rgba(0,120,220,0.12) inset;
    opacity: 0; transition: opacity 0.6s; animation: breathe 2.6s infinite; }
  .initbtn.ready { opacity: 1; }
  .initbtn:hover { background: rgba(0,220,255,0.1); }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 24px rgba(0,220,255,0.2); }
    50% { box-shadow: 0 0 46px rgba(0,220,255,0.5); } }
  .boot .note { font-size: 8.5px; letter-spacing: 0.24em; color: var(--faint); }
  .boot .err { color: #f4938f; font-size: 10px; letter-spacing: 0.1em; max-width: 420px; text-align: center; line-height: 1.7; }

  @media (prefers-reduced-motion: reduce) {
    .boot-title, .initbtn { animation: none; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="grid"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="hud">
  <div class="row">
    <div>
      <div class="wordmark">J.A.R.V.I.S<b>.</b></div>
      <div class="sub">BIOGREEN CORTEX // VOICE LINK v2.1</div>
    </div>
    <div class="statuschip">
      <div class="state" id="state">OFFLINE</div>
      <div class="timer" id="timer">00:00</div>
    </div>
  </div>

  <div class="bottom">
    <div class="caption-user" id="cap-user"></div>
    <div class="caption-ai" id="cap-ai"></div>
    <div class="controls">
      <span class="hint" id="hint"></span>
      <button class="ctl danger" id="endbtn" hidden>STAND DOWN</button>
    </div>
  </div>
</div>

<div class="boot" id="boot">
  <div class="boot-title">J.A.R.V.I.S<b>.</b></div>
  <div class="bootlog" id="bootlog"></div>
  <button class="initbtn" id="initbtn">◉ &nbsp;INITIALIZE</button>
  <div class="note">ONE TAP GRANTS THE MIC — THEN JUST SPEAK, ANYTIME. NO BUTTONS.</div>
  <div class="err" id="booterr"></div>
</div>

<script type="module">
  const AGENT_ID = "agent_3001kzgz64emesm91398nx05c17e";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- boot log ---------------- */
  const bootlog = document.getElementById("bootlog");
  const lines = [
    ["biogreen cortex // waking", 0],
    ["memory      .......... <span class='ok'>OK</span>  (jarvis/memory.md)", 260],
    ["agent fleet .......... <span class='ok'>21 WORKFLOWS LINKED</span>", 520],
    ["board       .......... <span class='ok'>4 SEATS · DOCTRINE VERIFIED</span>", 800],
    ["voice link  .......... <span class='ok'>ELEVENLABS REALTIME</span>", 1080],
    ["directive   .......... ship the store. hold the ad money.", 1400]
  ];
  lines.forEach(([html, t]) => setTimeout(() => {
    const d = document.createElement("div"); d.innerHTML = html; bootlog.appendChild(d);
  }, t));
  setTimeout(() => document.getElementById("initbtn").classList.add("ready"), 1700);

  /* ---------------- visual state ---------------- */
  let energy = 0;          // 0..1 — jarvis speaking intensity (audio-reactive)
  let userEnergy = 0;      // 0..1 — ryan speaking intensity
  let mode = "offline";    // offline | connecting | listening | speaking

  const stateEl = document.getElementById("state");
  function setStateLabel() {
    stateEl.className = "state " +
      (mode === "speaking" ? "speak" : mode === "listening" ? "listen" : mode === "connecting" ? "live" : "");
    stateEl.textContent =
      mode === "speaking" ? "JARVIS · SPEAKING" :
      mode === "listening" ? "ALWAYS LISTENING — JUST SPEAK" :
      mode === "connecting" ? "ESTABLISHING LINK…" : "OFFLINE";
  }

  /* ---------------- conversation ---------------- */
  const boot = document.getElementById("boot");
  const bootErr = document.getElementById("booterr");
  const capUser = document.getElementById("cap-user");
  const capAi = document.getElementById("cap-ai");
  const endbtn = document.getElementById("endbtn");
  const hint = document.getElementById("hint");
  const timerEl = document.getElementById("timer");
  let conv = null, t0 = null, timerIv = null;

  async function initialize() {
    bootErr.textContent = "";
    mode = "connecting"; setStateLabel();
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      bootErr.textContent = "MICROPHONE BLOCKED — allow mic access for this site in your browser settings, then tap INITIALIZE again.";
      mode = "offline"; setStateLabel(); return;
    }
    let Conversation;
    try {
      ({ Conversation } = await import("https://cdn.jsdelivr.net/npm/@elevenlabs/client@latest/+esm"));
    } catch (e) {
      bootErr.textContent = "VOICE ENGINE FAILED TO LOAD — check connection and reload.";
      mode = "offline"; setStateLabel(); return;
    }
    const opts = {
      agentId: AGENT_ID,
      onConnect: () => {
        boot.classList.add("gone");
        endbtn.hidden = false;
        hint.textContent = "LINK ACTIVE · SESSIONS RUN UP TO 10 MIN";
        mode = "listening"; setStateLabel();
        t0 = Date.now();
        timerIv = setInterval(() => {
          const s = Math.floor((Date.now() - t0) / 1000);
          timerEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
        }, 1000);
      },
      onDisconnect: () => {
        mode = "offline"; setStateLabel();
        clearInterval(timerIv);
        endbtn.hidden = true;
        hint.textContent = "";
        boot.classList.remove("gone");
        bootErr.textContent = "LINK CLOSED — tap INITIALIZE to reconnect.";
      },
      onError: (e) => {
        console.error(e);
        bootErr.textContent = "LINK ERROR — tap INITIALIZE to reconnect.";
      },
      onModeChange: (m) => {
        const mm = m && m.mode ? m.mode : m;
        mode = mm === "speaking" ? "speaking" : "listening";
        setStateLabel();
      },
      onMessage: (msg) => {
        const src = msg && (msg.source || msg.role);
        const text = msg && (msg.message || msg.text);
        if (!text) return;
        if (src === "user") { capUser.textContent = text; }
        else { capAi.textContent = text; }
      }
    };
    try {
      conv = await Conversation.startSession({ ...opts, connectionType: "webrtc" });
    } catch (e1) {
      try { conv = await Conversation.startSession(opts); }
      catch (e2) {
        console.error(e2);
        bootErr.textContent = "COULD NOT REACH THE AGENT — reload and try again.";
        mode = "offline"; setStateLabel(); return;
      }
    }
  }

  document.getElementById("initbtn").addEventListener("click", initialize);
  endbtn.addEventListener("click", async () => { if (conv) { try { await conv.endSession(); } catch (e) {} conv = null; } });

  /* per-frame audio reactivity from the real voice streams */
  function sampleAudio() {
    if (!conv) return;
    try {
      const out = conv.getOutputByteFrequencyData && conv.getOutputByteFrequencyData();
      if (out && out.length) {
        let s = 0; for (let i = 0; i < out.length; i++) s += out[i];
        const level = s / out.length / 255;
        energy += ((mode === "speaking" ? Math.min(1, level * 2.6 + 0.25) : level * 1.5) - energy) * 0.25;
      }
      const inp = conv.getInputByteFrequencyData && conv.getInputByteFrequencyData();
      if (inp && inp.length) {
        let s2 = 0; for (let i = 0; i < inp.length; i++) s2 += inp[i];
        userEnergy += (Math.min(1, (s2 / inp.length / 255) * 3) - userEnergy) * 0.3;
      }
    } catch (e) { /* stream not ready yet */ }
    if (!conv) { energy *= 0.95; userEnergy *= 0.95; }
  }

  /* ---------------- neural cortex ---------------- */
  const canvas = document.getElementById("scene"), ctx = canvas.getContext("2d");
  let W = 0, H = 0; const DPR = Math.min(devicePixelRatio || 1, 2);
  const core = { x: 0, y: 0 };

  const CLUSTERS = {
    core:     { hue: "#00dcff", angle: 0,    r: 0    },
    content:  { hue: "#e44fd0", angle: -2.4, r: 0.82 },
    commerce: { hue: "#00dcff", angle: -0.85, r: 0.85 },
    intel:    { hue: "#4ade80", angle: 0.4,  r: 0.8  },
    comms:    { hue: "#8b7cf6", angle: 1.6,  r: 0.82 },
    board:    { hue: "#f5b84b", angle: 2.75, r: 0.76 }
  };
  const NODES = [
    ["", "core", 3, 0],
    ["memory", "core", 1.5, 1], ["skills", "core", 1.2, 0],
    ["viral engine", "content", 1.6, 1], ["content agent", "content", 1.3, 1],
    ["ads agent", "content", 1.2, 0], ["higgsfield", "content", 1.2, 1], ["kling", "content", 1.0, 0],
    ["shopify", "commerce", 1.5, 1], ["metricool", "commerce", 1.2, 1],
    ["meta ads", "commerce", 1.1, 0], ["tiktok shop", "commerce", 1.0, 0], ["bio n:ov", "commerce", 1.2, 1],
    ["ai manager", "intel", 1.6, 1], ["market brief", "intel", 1.3, 1], ["research", "intel", 1.1, 0],
    ["cs chat", "comms", 1.3, 1], ["whatsapp", "comms", 1.1, 0], ["voice", "comms", 1.1, 0],
    ["hormozi", "board", 1.3, 1], ["munger", "board", 1.3, 1],
    ["godin", "board", 1.3, 1], ["blakely", "board", 1.3, 1]
  ];
  let nodes = [], edges = [], pulses = [];

  function layout() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const cx = W / 2, cy = H * 0.44, R = Math.min(W, H) * 0.36;
    core.x = cx; core.y = cy;
    nodes = []; edges = [];
    const per = {};
    NODES.forEach((n, i) => {
      const c = CLUSTERS[n[1]]; let x, y;
      if (n[1] === "core") {
        x = cx + (i === 0 ? 0 : i === 1 ? -R * 0.2 : R * 0.18);
        y = cy + (i === 0 ? 0 : R * 0.15);
      } else {
        per[n[1]] = (per[n[1]] || 0) + 1;
        const k = per[n[1]], seed = Math.sin(i * 127.1) * 43758.5453, jr = seed - Math.floor(seed);
        const a = c.angle + (k * 0.55 - 1.1) * 0.48;
        const rr = R * c.r * (0.6 + jr * 0.5) * (0.6 + 0.15 * (k % 4));
        x = cx + Math.cos(a) * rr * 1.3;
        y = cy + Math.sin(a) * rr * 0.95;
      }
      nodes.push({ name: n[0], cluster: n[1], size: n[2], labeled: n[3],
        x, y, bx: x, by: y, phase: Math.random() * 6.28 });
    });
    const hubs = {};
    nodes.forEach((nd, i) => {
      if (nd.cluster === "core") { if (i > 0) edges.push([0, i]); return; }
      if (hubs[nd.cluster] === undefined) { hubs[nd.cluster] = i; edges.push([0, i]); }
      else edges.push([hubs[nd.cluster], i]);
    });
  }

  function spawnPulse() {
    const e = edges[(Math.random() * edges.length) | 0];
    const rev = Math.random() < 0.5;
    pulses.push({ a: rev ? e[1] : e[0], b: rev ? e[0] : e[1], t: 0, speed: 0.008 + Math.random() * 0.014 });
    if (pulses.length > 70) pulses.shift();
  }

  const qbez = (a, m, b, t) => { const u = 1 - t; return u * u * a + 2 * u * t * m + t * t * b; };
  const hexA = (hex, a) => "rgba(" + parseInt(hex.slice(1, 3), 16) + "," + parseInt(hex.slice(3, 5), 16) + "," + parseInt(hex.slice(5, 7), 16) + "," + a + ")";

  let last = 0;
  function frame(ts) {
    const dt = ts - last; last = ts;
    sampleAudio();
    ctx.clearRect(0, 0, W, H);
    const time = ts * 0.001;
    const E = Math.max(energy, userEnergy * 0.45);

    if (!reduced) nodes.forEach(n => {
      const drift = 4 + E * 7;
      n.x = n.bx + Math.sin(time * (0.4 + E) + n.phase) * drift;
      n.y = n.by + Math.cos(time * (0.33 + E * 0.8) + n.phase * 1.7) * drift;
    });

    ctx.lineWidth = 0.7 + E;
    edges.forEach(e => {
      const a = nodes[e[0]], b = nodes[e[1]];
      const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      const al = 0.2 + E * 0.35;
      g.addColorStop(0, hexA(CLUSTERS[a.cluster].hue, al));
      g.addColorStop(1, hexA(CLUSTERS[b.cluster].hue, al));
      ctx.strokeStyle = g;
      ctx.beginPath(); ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo((a.x + b.x) / 2 + Math.sin(time * 0.5 + e[0]) * 7,
        (a.y + b.y) / 2 + Math.cos(time * 0.4 + e[1]) * 7, b.x, b.y);
      ctx.stroke();
    });

    /* eruption rays — driven by real output audio */
    if (energy > 0.08) {
      const rays = 18;
      for (let ri = 0; ri < rays; ri++) {
        const ang = (ri / rays) * 6.283 + time * 0.6;
        const len = (60 + Math.sin(time * 7 + ri * 2.4) * 40) * energy * (1.8 + Math.sin(ri * 7.3) * 0.6);
        ctx.strokeStyle = hexA("#aeeaff", 0.2 * energy + 0.12 * energy * Math.abs(Math.sin(time * 6 + ri)));
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(core.x + Math.cos(ang) * 14, core.y + Math.sin(ang) * 14);
        ctx.lineTo(core.x + Math.cos(ang) * (14 + len), core.y + Math.sin(ang) * (14 + len));
        ctx.stroke();
      }
    }
    /* listening shimmer ring — driven by Ryan's own voice */
    if (userEnergy > 0.05) {
      ctx.strokeStyle = hexA("#00dcff", 0.25 + userEnergy * 0.4);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(core.x, core.y, 30 + userEnergy * 55 + Math.sin(time * 9) * 5, 0, 6.29);
      ctx.stroke();
    }

    if (!reduced) {
      for (let i = pulses.length - 1; i >= 0; i--) {
        const p = pulses[i]; p.t += p.speed * (dt / 16.6) * (1 + E * 2);
        if (p.t >= 1) { pulses.splice(i, 1); continue; }
        const A = nodes[p.a], B = nodes[p.b];
        const x = qbez(A.x, (A.x + B.x) / 2, B.x, p.t), y = qbez(A.y, (A.y + B.y) / 2, B.y, p.t);
        const hue = CLUSTERS[B.cluster].hue;
        const gr = ctx.createRadialGradient(x, y, 0, x, y, 8);
        gr.addColorStop(0, hexA(hue, 0.9)); gr.addColorStop(1, hexA(hue, 0));
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 8, 0, 6.29); ctx.fill();
      }
      if (Math.random() < 0.1 + E * 0.6) spawnPulse();
    }

    nodes.forEach((n, i) => {
      const hue = CLUSTERS[n.cluster].hue;
      const boost = i === 0 ? energy * 12 + userEnergy * 4 : 0;
      const r = 2.4 * n.size + (i === 0 ? 6 + Math.sin(time * 2) * 1.6 + boost : 0);
      const glowR = r * (6 + (i === 0 ? energy * 7 : 0));
      const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, glowR);
      glow.addColorStop(0, hexA(hue, i === 0 ? 0.6 + energy * 0.4 : 0.32));
      glow.addColorStop(1, hexA(hue, 0));
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(n.x, n.y, glowR, 0, 6.29); ctx.fill();
      ctx.fillStyle = i === 0 ? "#f2ffff" : hexA(hue, 0.95);
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.29); ctx.fill();
      if (i === 0) {
        for (let ring = 0; ring < 2; ring++) {
          ctx.strokeStyle = hexA("#00dcff", 0.45 - ring * 0.18 + energy * 0.3);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r + 8 + ring * 9 + Math.sin(time * 2 + ring) * 2 + energy * 10, 0, 6.29);
          ctx.stroke();
        }
      }
      if (n.labeled) {
        ctx.font = "400 9px " + "ui-monospace, Menlo, monospace";
        ctx.fillStyle = "rgba(160,185,215,0.7)";
        ctx.textAlign = "center";
        ctx.fillText(n.name.toUpperCase(), n.x, n.y - r - 7);
      }
    });

    requestAnimationFrame(frame);
  }

  layout();
  addEventListener("resize", layout);
  requestAnimationFrame(ts => { last = ts; requestAnimationFrame(frame); });
</script>
</body>
</html>
