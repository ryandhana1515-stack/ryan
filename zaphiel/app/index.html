  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .msg.sys .bd { color: var(--dim); font-size: 11.5px; line-height: 1.7;

  .send { background: rgba(61,255,162,.12); border: 1px solid rgba(61,255,162,.42); color: var(--grn);

  .send:hover { background: rgba(61,255,162,.22); }

  /* ---------------- boot ---------------- */
  .boot { position: fixed; inset: 0; z-index: 20; background: #03060a; display: flex;

  .blog { font-size: 10px; line-height: 1.95; letter-spacing: .05em; color: var(--dim);

  .blog .ok { color: var(--grn); }
  .blog .w { color: var(--amber); }
  .initb { background: none; border: 1px solid var(--grn); color: var(--grn); font: inherit;
    font-size: 11px; letter-spacing: .36em; padding: 14px 30px 14px 36px; border-radius: 3px;
    cursor: pointer; opacity: 0; transition: opacity .5s; animation: breathe 2.6s infinite; }
  .initb.ready { opacity: 1; }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 20px rgba(61,255,162,.18); }

  .boot .note { font-size: 8px; letter-spacing: .2em; color: var(--faint); text-align: center; max-width: 400px; line-height: 1.8; }
  .boot .err { color: var(--red); font-size: 10px; max-width: 400px; text-align: center; line-height: 1.7; }

  @media (max-width: 780px) {

  const time = ts * 0.001;
  const dim = mode === "armed" ? 0.62 : mode === "offline" ? 0.42 : 1;
  const E = Math.max(energy, userEnergy * 0.45) * dim;

  if (!reduced) nodes.forEach(n => {
    const dr = (4 + E * 7) * dim;
    n.x = n.bx + Math.sin(time * (0.4 + E) + n.ph) * dr;
    n.y = n.by + Math.cos(time * (0.33 + E * 0.8) + n.ph * 1.7) * dr;
  });

  dragon(time, E);

  ctx.lineWidth = 0.7 + E;
  edges.forEach(e => {
    const a = nodes[e[0]], b = nodes[e[1]];
    const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    const al = (0.17 + E * 0.32) * dim;
    g.addColorStop(0, hexA(CL[a.cl], al));
    g.addColorStop(1, hexA(CL[b.cl], al));
    ctx.strokeStyle = g;
    ctx.beginPath(); ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo((a.x + b.x) / 2 + Math.sin(time * 0.5 + e[0]) * 7,
      (a.y + b.y) / 2 + Math.cos(time * 0.4 + e[1]) * 7, b.x, b.y);
    ctx.stroke();
  });

  if (energy > 0.08) {
    for (let ri = 0; ri < 18; ri++) {
      const ang = (ri / 18) * 6.283 + time * 0.6;
      const len = (58 + Math.sin(time * 7 + ri * 2.4) * 40) * energy * (1.8 + Math.sin(ri * 7.3) * 0.6);
      ctx.strokeStyle = hexA("#aeffdd", 0.18 * energy + 0.12 * energy * Math.abs(Math.sin(time * 6 + ri)));
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(core.x + Math.cos(ang) * 14, core.y + Math.sin(ang) * 14);
      ctx.lineTo(core.x + Math.cos(ang) * (14 + len), core.y + Math.sin(ang) * (14 + len));
      ctx.stroke();
    }
  }
  if (userEnergy > 0.05) {
    ctx.strokeStyle = hexA("#00dcff", 0.22 + userEnergy * 0.4);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(core.x, core.y, 30 + userEnergy * 55 + Math.sin(time * 9) * 5, 0, 6.29);
    ctx.stroke();
  }

  if (!reduced) {
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i]; p.t += p.sp * (dt / 16.6) * (1 + E * 2);
      if (p.t >= 1) { pulses.splice(i, 1); continue; }
      const A = nodes[p.a], B = nodes[p.b];
      const x = qbez(A.x, (A.x + B.x) / 2, B.x, p.t), y = qbez(A.y, (A.y + B.y) / 2, B.y, p.t);
      const hue = CL[B.cl];
      const gr = ctx.createRadialGradient(x, y, 0, x, y, 8);
      gr.addColorStop(0, hexA(hue, 0.9)); gr.addColorStop(1, hexA(hue, 0));
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 8, 0, 6.29); ctx.fill();
    }
    if (Math.random() < (0.06 + E * 0.6) * dim) spawnPulse();
  }

  nodes.forEach((n, i) => {
    const hue = CL[n.cl];
    const boost = i === 0 ? energy * 12 + userEnergy * 4 : 0;
    const r = 2.4 * n.size + (i === 0 ? 6 + Math.sin(time * 2) * 1.6 + boost : 0);
    const gR = r * (6 + (i === 0 ? energy * 7 : 0));
    const gl = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, gR);
    gl.addColorStop(0, hexA(hue, (i === 0 ? 0.6 + energy * 0.4 : 0.3) * dim));
    gl.addColorStop(1, hexA(hue, 0));
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(n.x, n.y, gR, 0, 6.29); ctx.fill();
    ctx.fillStyle = i === 0 ? "#f2fff8" : hexA(hue, 0.95 * dim);
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.29); ctx.fill();
    if (i === 0) for (let ring = 0; ring < 2; ring++) {
      ctx.strokeStyle = hexA("#3dffa2", (0.4 - ring * 0.16 + energy * 0.3) * dim);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 8 + ring * 9 + Math.sin(time * 2 + ring) * 2 + energy * 10, 0, 6.29);
      ctx.stroke();
    }
    if (n.lab) {
      ctx.font = "400 8.5px " + "ui-monospace, Menlo, monospace";
      ctx.fillStyle = "rgba(150,196,178," + 0.66 * dim + ")";
      ctx.textAlign = "center";
      ctx.fillText(n.name.toUpperCase(), n.x, n.y - r - 7);
    }
  });
}

layout();
addEventListener("resize", () => { layout(); });
requestAnimationFrame(ts => { last = ts; requestAnimationFrame(frame); });
markSidebar();
</script>
</body>
</html>
