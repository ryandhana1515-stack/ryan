<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EDG test form (DEVELOPMENT)</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1c2126; }
    .banner { background: #fff4d6; border: 1px solid #e6c65c; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #c9ced4; border-radius: 6px; font: inherit; box-sizing: border-box; }
    button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 6px; background: #1c5bd6; color: #fff; font: inherit; cursor: pointer; }
    pre { background: #f3f5f7; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    .hp { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <p class="banner"><strong>DEVELOPMENT test page.</strong> FAKE data only. It posts to the local EDG API; nothing is sent to real customers (MOCK adapters).</p>
  <h1>Website enquiry</h1>
  <form id="f">
    <label>Organisation <select name="org"><option value="acme-demo">Acme Demo (FAKE)</option><option value="beta-demo">Beta Demo (FAKE)</option></select></label>
    <label>Name <input name="name" value="Test Customer (FAKE)" /></label>
    <label>Phone <input name="phone" value="9000 0123" /></label>
    <label>Email <input name="email" value="test.customer@example.com" /></label>
    <label>Message <textarea name="message" rows="3">I'd like to know more about your services.</textarea></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
    <button>Send enquiry</button>
  </form>
  <h2>Result</h2>
  <pre id="out">—</pre>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target));
      const org = d.org; delete d.org;
      const r = await fetch(`/api/o/${org}/leads`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...d, source: 'website_form', utm: { utm_source: 'test-page' } }) });
      document.getElementById('out').textContent = r.status + '\n' + JSON.stringify(await r.json(), null, 2);
    });
  </script>
</body>
</html>
