  .card p { color: var(--ink-2); font-size: 15.5px; }
  .card ul { list-style: none; padding: 0; }
  .card li { padding: 7px 0 7px 30px; position: relative; color: var(--ink-2); font-size: 15.5px; }
  .card li::before { content: "✓"; position: absolute; left: 2px; color: var(--cyan); font-weight: 900; }
  .why li::before { content: "★"; color: #f0b429; }
  .bubble { background: #0d1430; border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px;

  .bubble b { color: var(--cyan); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 3px; }
  .vframe { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden;
            background: #0d1430; border: 1px solid var(--border); }
  .vframe iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vsoon { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;

  .others { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 40px; }
